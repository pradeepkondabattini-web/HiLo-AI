name: hilo
description: HiLo — AI-native Event Operating System (consumer app).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management + DI (EOS-003-P2 §4, §8, §10)
  flutter_riverpod: ^2.5.1
  # Routing (EOS-003-P2 §9)
  go_router: ^14.2.0
  # Networking (EOS-003-P2 §4) — used by data sources, never from UI
  dio: ^5.5.0
  # Structured logging (EOS-003-P2 §4)
  logger: ^2.4.0
  # Localization (version pinned by flutter_localizations)
  intl: ^0.20.2

  # Identity (EOS-002-P3-Part-02, EOS-004-P6) — Firebase Auth providers
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true # enables gen-l10n from l10n.yaml
