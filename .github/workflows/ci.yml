name: CI

# Continuous Integration (EOS-001-P7 §18): every push/PR runs static analysis,
# formatting checks, unit tests, build, dependency validation, and secret scanning.
# Component jobs run only when their paths change (ADR-007 — path-filtered monorepo CI).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─── Detect which components changed ─────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      flutter: ${{ steps.filter.outputs.flutter }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend-api/**'
              - '.github/workflows/ci.yml'
            flutter:
              - 'flutter-app/**'
              - '.github/workflows/ci.yml'

  # ─── Backend microservices (Node.js + TypeScript) ───────────────────────────
  backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend-api/package-lock.json
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Format check (Prettier)
        run: npm run format:check
      - name: Typecheck (tsc --build)
        run: npm run typecheck
      - name: Unit tests (vitest)
        run: npm test
      - name: Build (tsup bundle)
        run: npm run build
      - name: Dependency audit (production deps only)
        run: npm audit --omit=dev --audit-level=high

  # ─── Flutter application ─────────────────────────────────────────────────────
  flutter:
    needs: changes
    if: ${{ needs.changes.outputs.flutter == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Ensure platform scaffolding (generated, not committed)
        run: flutter create . --org ai.hilo --project-name hilo --platforms=android,ios,web
      - name: Install dependencies (also runs gen-l10n)
        run: flutter pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Static analysis
        run: flutter analyze
      - name: Unit & widget tests
        run: flutter test

  # ─── Secret scanning (all changes) ──────────────────────────────────────────
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
